<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 대입 진학 관리 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS (xlsx) CDN for Excel Import/Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8fafc;
    }
    .empty-cell {
      background-color: #f1f5f9;
      color: #94a3b8;
    }
    /* 테이블 가로 스크롤 및 고정 최적화 */
    .table-container {
      overflow-x: auto;
      max-width: 100%;
    }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg">
          <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">2026 대입 진학 관리 시스템</h1>
          <p class="text-xs text-slate-400">장성고등학교 진로진학상담부</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3 py-2 rounded-md border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-excel text-emerald-400"></i>
          <span>엑셀 파일 업로드</span>
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
        </label>
        <button onclick="exportCurrentClassToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-xs text-white font-medium px-3 py-2 rounded-md transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-download"></i>
          <span>현재 반 엑셀 내보내기</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Control Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2">
          <label for="classSelect" class="text-sm font-semibold text-slate-700">학급 선택:</label>
          <select id="classSelect" onchange="onClassChange()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="3학년 1반">3학년 1반</option>
            <option value="3학년 2반">3학년 2반</option>
            <option value="3학년 3반">3학년 3반</option>
            <option value="3학년 4반">3학년 4반</option>
            <option value="3학년 5반" selected>3학년 5반</option>
            <option value="3학년 6반">3학년 6반</option>
          </select>
        </div>
        <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-medium border border-indigo-100" id="studentCountBadge">
          총 학생수: 0명
        </span>
      </div>

      <div class="flex items-center space-x-2 text-xs text-slate-500">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> 합격</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span> 불합격</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> 1차합격/대기</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-300 inline-block"></span> 미입력(-)</span>
      </div>
    </div>

    <!-- Student Application Data Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="table-container">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 font-semibold uppercase tracking-wider text-[11px]">
              <th class="py-3 px-2 text-center w-12 border-r border-slate-200">반</th>
              <th class="py-3 px-2 text-center w-12 border-r border-slate-200">번호</th>
              <th class="py-3 px-3 text-center w-20 border-r border-slate-200">이름</th>
              <th class="py-3 px-2 text-center w-14 border-r border-slate-200">지역</th>
              <th class="py-3 px-3 text-center w-24 border-r border-slate-200">대학명</th>
              <th class="py-3 px-2 text-center w-16 border-r border-slate-200">전형유형</th>
              <th class="py-3 px-3 text-center w-28 border-r border-slate-200">세부유형</th>
              <th class="py-3 px-3 text-center w-28 border-r border-slate-200">모집단위</th>
              <th class="py-3 px-2 text-center w-24 border-r border-slate-200">최저학력기준</th>
              <th class="py-3 px-3 text-center w-28 border-r border-slate-200">면접/논술일자</th>
              <th class="py-3 px-2 text-center w-20 border-r border-slate-200 bg-indigo-50/50">1단계</th>
              <th class="py-3 px-2 text-center w-24 border-r border-slate-200">최종발표일</th>
              <th class="py-3 px-2 text-center w-20 border-r border-slate-200 bg-indigo-50/50">최종단계</th>
              <th class="py-3 px-3 text-center min-w-[120px]">불합격사유</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-slate-200">
            <!-- Dynamic Rows will be inserted here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // Initial Sample Raw Data (Excel DB structure simulation)
    let rawDatabase = [
      // 3학년 5반 샘플 데이터 (요청된 12가지 정보)
      { id: 1, gradeClass: "3학년 5반", num: 1, name: "김서울", region: "서울", university: "서울대학교", type: "학생부종합", detailType: "일반전형", dept: "컴퓨터공학부", minExam: "3개합 7이내", interviewDate: "2026-11-28", step1: "합격", finalDate: "2026-12-15", finalStep: "합격", failReason: "" },
      { id: 2, gradeClass: "3학년 5반", num: 1, name: "김서울", region: "서울", university: "연세대학교", type: "학생부교과", detailType: "추천형", dept: "인공지능학과", minExam: "미적용", interviewDate: "2026-10-18", step1: "합격", finalDate: "2026-11-12", finalStep: "불합격", failReason: "최저 미충족" },
      { id: 3, gradeClass: "3학년 5반", num: 1, name: "김서울", region: "서울", university: "고려대학교(서울)", type: "학생부종합", detailType: "학업우수전형", dept: "데이터과학과", minExam: "4개합 8이내", interviewDate: "2026-11-21", step1: "1차합격", finalDate: "2026-12-15", finalStep: "", failReason: "" },
      { id: 4, gradeClass: "3학년 5반", num: 1, name: "김서울", region: "서울", university: "한양대학교", type: "논술전형", detailType: "논술우수자", dept: "소프트웨어전형", minExam: "미적용", interviewDate: "2026-11-22", step1: "", finalDate: "2026-12-15", finalStep: "", failReason: "" },

      { id: 5, gradeClass: "3학년 5반", num: 2, name: "박연세", region: "서울", university: "연세대학교", type: "학생부종합", detailType: "활동우수형", dept: "경영학과", minExam: "2개합 4이내", interviewDate: "2026-11-15", step1: "합격", finalDate: "2026-12-15", finalStep: "합격", failReason: "" },
      { id: 6, gradeClass: "3학년 5반", num: 2, name: "박연세", region: "서울", university: "성균관대학교", type: "학생부교과", detailType: "학교장추천", dept: "글로벌경영", minExam: "3개합 6이내", interviewDate: "", step1: "합격", finalDate: "2026-12-10", finalStep: "합격", failReason: "" },
      { id: 7, gradeClass: "3학년 5반", num: 2, name: "박연세", region: "서울", university: "서강대학교", type: "학생부종합", detailType: "일반전형", dept: "경영학부", minExam: "미적용", interviewDate: "", step1: "1차합격", finalDate: "2026-12-15", finalStep: "", failReason: "" },

      { id: 8, gradeClass: "3학년 5반", num: 3, name: "이민준", region: "경기", university: "아주대학교", type: "학생부교과", detailType: "고교추천", dept: "기계공학과", minExam: "2개합 5이내", interviewDate: "", step1: "합격", finalDate: "2026-12-12", finalStep: "합격", failReason: "" },
      { id: 9, gradeClass: "3학년 5반", num: 3, name: "이민준", region: "전남", university: "전남대학교", type: "학생부교과", detailType: "일반전형", dept: "기계공학부", minExam: "미적용", interviewDate: "", step1: "합격", finalDate: "2026-12-10", finalStep: "합격", failReason: "" },

      // 3학년 1반 샘플
      { id: 10, gradeClass: "3학년 1반", num: 1, name: "강지훈", region: "서울", university: "중앙대학교", type: "학생부종합", detailType: "CAU탐구형", dept: "전자전기공학부", minExam: "미적용", interviewDate: "2026-11-29", step1: "합격", finalDate: "2026-12-15", finalStep: "합격", failReason: "" },
      { id: 11, gradeClass: "3학년 6반", num: 1, name: "최동현", region: "서울", university: "경희대학교", type: "실기/실적", detailType: "실기우수자", dept: "체육학과", minExam: "미적용", interviewDate: "2026-10-25", step1: "합격", finalDate: "2026-11-20", finalStep: "합격", failReason: "" }
    ];

    // Page Initialize
    window.addEventListener('DOMContentLoaded', () => {
      renderTable();
    });

    // Class selection change event
    function onClassChange() {
      renderTable();
    }

    // Class Name Normalizer (e.g. "3-5", "5반", "3학년 5반" -> "3학년 5반")
    function normalizeClassName(inputStr) {
      if (!inputStr) return "";
      const str = String(inputStr).trim();
      
      const match = str.match(/(\d+)\s*학년\s*(\d+)\s*반/) || str.match(/(\d+)-(\d+)/);
      if (match) {
        return `${match[1]}학년 ${match[2]}반`;
      }
      const singleNumMatch = str.match(/^(\d+)\s*반?$/);
      if (singleNumMatch) {
        return `3학년 ${singleNumMatch[1]}반`;
      }
      return str;
    }

    // Helper: University Name Summarizer ("서울대학교" -> "서울대")
    function summarizeUniv(univ) {
      if (!univ) return "";
      let cleaned = univ.trim();
      cleaned = cleaned.replace(/대학교$/, "대");
      return cleaned;
    }

    // Helper: Type Summarizer (Extract '교과', '종합', '실기', '논술')
    function summarizeType(typeStr) {
      if (!typeStr) return "";
      const keywords = ["교과", "종합", "실기", "논술"];
      const found = keywords.filter(k => typeStr.includes(k));
      return found.length > 0 ? found.join('/') : typeStr;
    }

    // Helper: Date Formatter ("2026-11-21" -> "'26.11.21.(토)")
    function formatDate(dateStr) {
      if (!dateStr) return "";
      
      // Clean string
      let cleaned = String(dateStr).trim().replace(/[.\/]/g, '-');
      const dateObj = new Date(cleaned);

      if (isNaN(dateObj.getTime())) {
        return dateStr; // Format mismatch return original
      }

      const yy = String(dateObj.getFullYear()).slice(-2);
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dayName = days[dateObj.getDay()];

      return `'${yy}.${mm}.${dd}.(${dayName})`;
    }

    // Main Table Render Function
    function renderTable() {
      const selectedClass = document.getElementById('classSelect').value;
      const normalizedTargetClass = normalizeClassName(selectedClass);

      // Filter by Class
      const classData = rawDatabase.filter(item => normalizeClassName(item.gradeClass) === normalizedTargetClass);

      // Group by Student (Number + Name)
      const studentGroupMap = new Map();
      classData.forEach(item => {
        const key = `${item.num}_${item.name}`;
        if (!studentGroupMap.has(key)) {
          studentGroupMap.set(key, {
            num: item.num,
            name: item.name,
            gradeClass: item.gradeClass,
            applications: []
          });
        }
        studentGroupMap.get(key).applications.push(item);
      });

      const groupedStudents = Array.from(studentGroupMap.values());
      // Sort by student number
      groupedStudents.sort((a, b) => Number(a.num) - Number(b.num));

      // Update Badge Count
      document.getElementById('studentCountBadge').innerText = `총 학생수: ${groupedStudents.length}명`;

      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';

      if (groupedStudents.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="14" class="py-12 text-center text-slate-400 bg-slate-50">
              <i class="fa-solid fa-folder-open text-3xl mb-2 block text-slate-300"></i>
              선택한 학급(${selectedClass})의 등록된 진학 데이터가 없습니다.
            </td>
          </tr>`;
        return;
      }

      // Render Rows
      groupedStudents.forEach(student => {
        const appCount = student.applications.length;

        student.applications.forEach((app, index) => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50/80 transition border-b border-slate-200";

          // Student Info Columns (Rowspan for the first application of student)
          let studentInfoCells = '';
          if (index === 0) {
            const classShort = student.gradeClass.replace("3학년 ", "");
            studentInfoCells = `
              <td rowspan="${appCount}" class="py-2 px-2 text-center font-semibold text-slate-700 bg-white border-r border-slate-200 align-middle">${classShort}</td>
              <td rowspan="${appCount}" class="py-2 px-2 text-center font-medium text-slate-600 bg-white border-r border-slate-200 align-middle">${student.num}</td>
              <td rowspan="${appCount}" class="py-2 px-3 text-center font-bold text-slate-900 bg-white border-r border-slate-200 align-middle">${student.name}</td>
            `;
          }

          // Data Extraction & Processing
          const regionText = renderCellContent(app.region);
          const univText = renderCellContent(summarizeUniv(app.university), "font-semibold text-slate-800");
          const typeText = renderCellContent(summarizeType(app.type));
          const detailTypeText = renderCellContent(app.detailType);
          const deptText = renderCellContent(app.dept);
          const minExamText = renderCellContent(app.minExam);
          const interviewOrEssayText = renderCellContent(formatDate(app.interviewDate || app.essayDate));
          const finalDateText = renderCellContent(formatDate(app.finalDate));
          const failReasonText = renderCellContent(app.failReason);

          // Editable Select Boxes for 1단계 & 최종단계
          const step1Select = createStatusSelectHtml(app.id, 'step1', app.step1);
          const finalStepSelect = createStatusSelectHtml(app.id, 'finalStep', app.finalStep);

          tr.innerHTML = `
            ${studentInfoCells}
            <td class="py-2 px-2 text-center border-r border-slate-200 ${getCellBgClass(app.region)}">${regionText}</td>
            <td class="py-2 px-3 text-center border-r border-slate-200 ${getCellBgClass(app.university)}">${univText}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 ${getCellBgClass(app.type)}">${typeText}</td>
            <td class="py-2 px-3 text-center border-r border-slate-200 ${getCellBgClass(app.detailType)}">${detailTypeText}</td>
            <td class="py-2 px-3 text-center border-r border-slate-200 ${getCellBgClass(app.dept)}">${deptText}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 ${getCellBgClass(app.minExam)}">${minExamText}</td>
            <td class="py-2 px-3 text-center border-r border-slate-200 ${getCellBgClass(app.interviewDate || app.essayDate)}">${interviewOrEssayText}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 bg-indigo-50/20">${step1Select}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 ${getCellBgClass(app.finalDate)}">${finalDateText}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 bg-indigo-50/20">${finalStepSelect}</td>
            <td class="py-2 px-3 text-center ${getCellBgClass(app.failReason)}">${failReasonText}</td>
          `;

          tbody.appendChild(tr);
        });
      });
    }

    // Cell Background Classifier
    function getCellBgClass(value) {
      if (!value || String(value).trim() === "" || String(value).trim() === "-") {
        return "empty-cell";
      }
      return "bg-white";
    }

    // Render Cell Content Helper
    function renderCellContent(value, extraClass = "") {
      if (!value || String(value).trim() === "" || String(value).trim() === "-") {
        return `<span class="text-slate-400 font-normal">-</span>`;
      }
      return `<span class="${extraClass}">${value}</span>`;
    }

    // Editable Status Dropdown Generator
    function createStatusSelectHtml(id, field, currentValue) {
      const val = (currentValue || "").trim();
      let colorStyle = "bg-slate-100 text-slate-500 border-slate-200";

      if (val === "합격") {
        colorStyle = "bg-emerald-100 text-emerald-800 border-emerald-300 font-bold";
      } else if (val === "불합격") {
        colorStyle = "bg-rose-100 text-rose-800 border-rose-300 font-medium";
      } else if (val === "1차합격" || val === "대기") {
        colorStyle = "bg-amber-100 text-amber-800 border-amber-300 font-medium";
      }

      return `
        <select onchange="updateStatus(${id}, '${field}', this.value)" 
                class="text-xs py-1 px-1.5 rounded border focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer ${colorStyle}">
          <option value="" ${val === "" ? "selected" : ""}>-</option>
          <option value="합격" ${val === "합격" ? "selected" : ""}>합격</option>
          <option value="불합격" ${val === "불합격" ? "selected" : ""}>불합격</option>
          <option value="1차합격" ${val === "1차합격" ? "selected" : ""}>1차합격</option>
          <option value="대기" ${val === "대기" ? "selected" : ""}>대기</option>
          <option value="미응시" ${val === "미응시" ? "selected" : ""}>미응시</option>
        </select>
      `;
    }

    // Update Status Handler (Editable Field Update)
    function updateStatus(id, field, value) {
      const target = rawDatabase.find(item => item.id === id);
      if (target) {
        target[field] = value;
        renderTable(); // Re-render table UI instantly
      }
    }

    // Excel File Upload Handler
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);

          if (jsonData.length === 0) {
            alert('엑셀 파일에 데이터가 없습니다.');
            return;
          }

          // Convert Excel Row to App Data Structure
          let newIdCounter = 1000;
          const parsedData = jsonData.map(row => {
            newIdCounter++;
            return {
              id: newIdCounter,
              gradeClass: normalizeClassName(row['반'] || row['학급'] || row['학년반'] || "3학년 5반"),
              num: row['번호'] || row['번'] || 1,
              name: row['이름'] || row['성명'] || "미상",
              region: row['지역'] || "",
              university: row['대학명'] || row['대학'] || "",
              type: row['전형유형'] || row['전형'] || "",
              detailType: row['세부유형'] || row['전형세부유형'] || "",
              dept: row['모집단위'] || row['학과'] || "",
              minExam: row['최저학력기준'] || row['최저'] || "",
              interviewDate: row['면접일자'] || row['면접/논술일자'] || row['논술일자'] || "",
              step1: row['1단계'] || "",
              finalDate: row['최종발표일'] || "",
              finalStep: row['최종단계'] || row['최종결과'] || "",
              failReason: row['불합격사유'] || ""
            };
          });

          rawDatabase = parsedData;
          renderTable();
          alert(`성공적으로 ${parsedData.length}건의 데이터를 불러왔습니다.`);
        } catch (err) {
          alert('엑셀 파일 분석 중 오류가 발생했습니다. 규격 포맷을 확인해 주세요.');
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // Export Current Class Data to Excel
    function exportCurrentClassToExcel() {
      const selectedClass = document.getElementById('classSelect').value;
      const normalizedTargetClass = normalizeClassName(selectedClass);

      const exportData = rawDatabase
        .filter(item => normalizeClassName(item.gradeClass) === normalizedTargetClass)
        .map(item => ({
          '반': item.gradeClass,
          '번호': item.num,
          '이름': item.name,
          '지역': item.region || '',
          '대학명': summarizeUniv(item.university) || '',
          '전형유형': summarizeType(item.type) || '',
          '세부유형': item.detailType || '',
          '모집단위': item.dept || '',
          '최저학력기준': item.minExam || '',
          '면접or논술일자': formatDate(item.interviewDate || item.essayDate) || '',
          '1단계': item.step1 || '',
          '최종발표일': formatDate(item.finalDate) || '',
          '최종단계': item.finalStep || '',
          '불합격사유': item.failReason || ''
        }));

      if (exportData.length === 0) {
        alert('내보낼 데이터가 없습니다.');
        return;
      }

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, selectedClass);
      
      XLSX.writeFile(workbook, `${selectedClass}_진학관리_데이터.xlsx`);
    }
  </script>
</body>
