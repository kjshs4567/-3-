<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 대입 진학 관리 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS (xlsx) CDN for Excel Import/Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8fafc;
    }
    .empty-cell {
      background-color: #f1f5f9;
      color: #94a3b8;
    }
    .disabled-stage-cell {
      background-color: #e2e8f0 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
    }
    .table-container {
      overflow-x: auto;
      max-width: 100%;
    }
  </style>
</head>
<body class="text-slate-800 antialiased bg-slate-100 min-h-screen flex flex-col">

  <!-- Navigation / Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg">
          <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">2026 대입 진학 관리 시스템</h1>
          <p class="text-xs text-slate-400">장성고등학교 진로진학상담부</p>
        </div>
      </div>

      <!-- Current Login Session Bar -->
      <div id="sessionBar" class="hidden items-center space-x-3">
        <span id="roleBadge" class="text-xs px-2.5 py-1 rounded-full font-bold bg-indigo-500 text-white shadow-sm">
          교사용
        </span>
        <button onclick="openPasswordChangeModal()" id="btnAdminSetting" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 px-2.5 py-1.5 rounded transition">
          <i class="fa-solid fa-key mr-1"></i>비밀번호 변경
        </button>
        <button onclick="logout()" class="text-xs bg-rose-600/80 hover:bg-rose-600 text-white px-2.5 py-1.5 rounded transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>로그아웃
        </button>
      </div>
    </div>
  </header>

  <!-- Login Modal View -->
  <div id="loginView" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200">
      <div class="bg-slate-800 text-white p-6 text-center">
        <i class="fa-solid fa-user-shield text-4xl text-indigo-400 mb-2"></i>
        <h2 class="text-xl font-bold">시스템 로그인</h2>
        <p class="text-xs text-slate-400 mt-1">접속 권한 유형을 선택하고 비밀번호를 입력하세요.</p>
      </div>
      <form onsubmit="handleLogin(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">사용자 권한</label>
          <select id="loginRole" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium">
            <option value="student">학생용 (조회 전용)</option>
            <option value="teacher" selected>교사용 (입력/수정/삭제)</option>
            <option value="admin">관리자용 (전체 관리 및 설정)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력 (기본: 1234)" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm shadow transition">
          접속하기
        </button>
      </form>
    </div>
  </div>

  <!-- Main Application Body -->
  <main id="mainApp" class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow hidden">

    <!-- Top Action Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
      
      <!-- Class Selector -->
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2">
          <label for="classSelect" class="text-sm font-semibold text-slate-700">학급 선택:</label>
          <select id="classSelect" onchange="renderTable()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="3학년 1반">3학년 1반</option>
            <option value="3학년 2반">3학년 2반</option>
            <option value="3학년 3반">3학년 3반</option>
            <option value="3학년 4반">3학년 4반</option>
            <option value="3학년 5반" selected>3학년 5반</option>
            <option value="3학년 6반">3학년 6반</option>
          </select>
        </div>
        <span id="studentCountBadge" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-bold border border-indigo-100">
          총 학생수: 0명
        </span>
      </div>

      <!-- Action Buttons for Teacher / Admin -->
      <div id="editorControls" class="hidden items-center space-x-2">
        <button onclick="openRecordModal()" class="bg-indigo-600 hover:bg-indigo-700 text-xs text-white font-semibold px-3 py-2 rounded-lg transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>지원 내역 추가</span>
        </button>
        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-file-excel text-emerald-400"></i>
          <span>엑셀 업로드</span>
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
        </label>
        <button onclick="exportCurrentClassToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-xs text-white font-semibold px-3 py-2 rounded-lg transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-download"></i>
          <span>엑셀 내보내기</span>
        </button>
      </div>
    </div>

    <!-- Data Table Container -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="table-container">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 font-bold uppercase tracking-wider text-[11px]">
              <th class="py-3 px-2 text-center w-12 border-r border-slate-200">반</th>
              <th class="py-3 px-2 text-center w-12 border-r border-slate-200">번호</th>
              <th class="py-3 px-3 text-center w-20 border-r border-slate-200">이름</th>
              <th class="py-3 px-3 text-center w-28 border-r border-slate-200">대학명</th>
              <th class="py-3 px-3 text-center w-28 border-r border-slate-200">세부유형</th>
              <th class="py-3 px-3 text-center w-28 border-r border-slate-200">모집단위</th>
              <th class="py-3 px-2 text-center w-24 border-r border-slate-200">최저학력기준</th>
              <th class="py-3 px-3 text-center w-28 border-r border-slate-200">면접/논술일자</th>
              <th class="py-3 px-2 text-center w-20 border-r border-slate-200 bg-indigo-50/50">1단계</th>
              <th class="py-3 px-2 text-center w-24 border-r border-slate-200">최종발표일</th>
              <th class="py-3 px-2 text-center w-20 border-r border-slate-200 bg-indigo-50/50">최종단계</th>
              <th class="py-3 px-3 text-center min-w-[120px] border-r border-slate-200">불합격사유</th>
              <th id="thActionHeader" class="py-3 px-2 text-center w-16 hidden">관리</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-slate-200">
            <!-- Dynamic Data Rows -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add / Edit Record Modal -->
  <div id="recordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-xl overflow-hidden border border-slate-200">
      <div class="bg-indigo-600 px-6 py-4 text-white flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-base">지원 내역 추가/수정</h3>
        <button onclick="closeRecordModal()" class="text-white hover:text-indigo-200 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="saveRecord(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
        <input type="hidden" id="editRecordId">
        
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">학급</label>
            <select id="inputGradeClass" class="w-full border rounded p-2 text-xs">
              <option value="3학년 1반">3학년 1반</option>
              <option value="3학년 2반">3학년 2반</option>
              <option value="3학년 3반">3학년 3반</option>
              <option value="3학년 4반">3학년 4반</option>
              <option value="3학년 5반" selected>3학년 5반</option>
              <option value="3학년 6반">3학년 6반</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">번호</label>
            <input type="number" id="inputNum" required min="1" class="w-full border rounded p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">이름</label>
            <input type="text" id="inputName" required class="w-full border rounded p-2 text-xs">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">대학명</label>
            <input type="text" id="inputUniversity" placeholder="예: 서울대학교" class="w-full border rounded p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">세부유형</label>
            <input type="text" id="inputDetailType" placeholder="예: 일반전형, 학교장추천" class="w-full border rounded p-2 text-xs">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">모집단위</label>
            <input type="text" id="inputDept" placeholder="예: 컴퓨터공학부" class="w-full border rounded p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">최저학력기준</label>
            <input type="text" id="inputMinExam" placeholder="예: 3개합 7이내" class="w-full border rounded p-2 text-xs">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">면접/논술일자</label>
            <input type="text" id="inputInterviewDate" placeholder="예: 2026-11-21 또는 기간" class="w-full border rounded p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">1단계 결과</label>
            <select id="inputStep1" class="w-full border rounded p-2 text-xs">
              <option value="">-</option>
              <option value="1차합격">1차합격</option>
              <option value="1차불합">1차불합</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">최종발표일</label>
            <input type="text" id="inputFinalDate" placeholder="예: 2026-12-15" class="w-full border rounded p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">최종단계 결과</label>
            <select id="inputFinalStep" class="w-full border rounded p-2 text-xs">
              <option value="">-</option>
              <option value="합격">합격</option>
              <option value="불합격">불합격</option>
              <option value="추합">추합</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">불합격사유</label>
          <input type="text" id="inputFailReason" placeholder="예: 최저 미충족" class="w-full border rounded p-2 text-xs">
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeRecordModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded text-xs text-slate-700 font-semibold">취소</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded text-xs text-white font-bold">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin Password Change Modal -->
  <div id="passwordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden border border-slate-200">
      <div class="bg-slate-800 px-6 py-4 text-white flex justify-between items-center">
        <h3 class="font-bold text-base"><i class="fa-solid fa-shield-halved text-amber-400 mr-2"></i>비밀번호 설정 변경</h3>
        <button onclick="closePasswordModal()" class="text-white hover:text-slate-300"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="savePasswords(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">학생용 비밀번호</label>
          <input type="text" id="pwdStudent" required class="w-full border rounded p-2 text-xs font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">교사용 비밀번호</label>
          <input type="text" id="pwdTeacher" required class="w-full border rounded p-2 text-xs font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">관리자용 비밀번호</label>
          <input type="text" id="pwdAdmin" required class="w-full border rounded p-2 text-xs font-mono">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closePasswordModal()" class="px-4 py-2 bg-slate-200 rounded text-xs font-semibold">취소</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded text-xs font-bold">변경사항 저장</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // State Management
    let passwords = {
      student: "1234",
      teacher: "1234",
      admin: "1234"
    };

    let currentRole = null; // 'student', 'teacher', 'admin'
    let rawDatabase = [];   // Main In-Memory Storage

    // Login Handler
    function handleLogin(event) {
      event.preventDefault();
      const role = document.getElementById('loginRole').value;
      const pwdInput = document.getElementById('loginPassword').value;

      if (pwdInput === passwords[role]) {
        currentRole = role;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('sessionBar').classList.remove('hidden');
        document.getElementById('sessionBar').classList.add('flex');

        // Role Badge UI
        const roleBadge = document.getElementById('roleBadge');
        if (role === 'student') {
          roleBadge.innerText = '학생용 (조회 전용)';
          roleBadge.className = 'text-xs px-2.5 py-1 rounded-full font-bold bg-slate-600 text-white';
        } else if (role === 'teacher') {
          roleBadge.innerText = '담임교사용';
          roleBadge.className = 'text-xs px-2.5 py-1 rounded-full font-bold bg-indigo-600 text-white';
        } else if (role === 'admin') {
          roleBadge.innerText = '최고관리자용';
          roleBadge.className = 'text-xs px-2.5 py-1 rounded-full font-bold bg-amber-600 text-white';
        }

        // Permission UI Controls
        const isEditor = (role === 'teacher' || role === 'admin');
        document.getElementById('editorControls').className = isEditor ? 'flex items-center space-x-2' : 'hidden';
        document.getElementById('btnAdminSetting').className = (role === 'admin') ? 'text-xs bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 px-2.5 py-1.5 rounded transition' : 'hidden';
        document.getElementById('thActionHeader').className = isEditor ? 'py-3 px-2 text-center w-16 font-bold' : 'hidden';

        renderTable();
      } else {
        alert('비밀번호가 올바르지 않습니다.');
      }
    }

    function logout() {
      currentRole = null;
      document.getElementById('loginPassword').value = '';
      document.getElementById('mainApp').classList.add('hidden');
      document.getElementById('sessionBar').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
    }

    // Password Change Modal
    function openPasswordChangeModal() {
      document.getElementById('pwdStudent').value = passwords.student;
      document.getElementById('pwdTeacher').value = passwords.teacher;
      document.getElementById('pwdAdmin').value = passwords.admin;
      document.getElementById('passwordModal').classList.remove('hidden');
    }

    function closePasswordModal() {
      document.getElementById('passwordModal').classList.add('hidden');
    }

    function savePasswords(e) {
      e.preventDefault();
      passwords.student = document.getElementById('pwdStudent').value;
      passwords.teacher = document.getElementById('pwdTeacher').value;
      passwords.admin = document.getElementById('pwdAdmin').value;
      alert('비밀번호 설정이 변경되었습니다.');
      closePasswordModal();
    }

    // Class Name Normalizer
    function normalizeClassName(inputStr) {
      if (!inputStr) return "";
      const str = String(inputStr).trim();
      const match = str.match(/(\d+)\s*학년\s*(\d+)\s*반/) || str.match(/(\d+)-(\d+)/);
      if (match) return `${match[1]}학년 ${match[2]}반`;
      const singleNumMatch = str.match(/^(\d+)\s*반?$/);
      if (singleNumMatch) return `3학년 ${singleNumMatch[1]}반`;
      return str;
    }

    // Helper: University Name Summarizer
    function summarizeUniv(univ) {
      if (!univ) return "";
      let cleaned = String(univ).trim();
      cleaned = cleaned.replace(/대학교$/, "대");
      return cleaned;
    }

    // Helper: Detail Type Summarizer (Remove '학생부', '전형')
    function summarizeDetailType(detailStr) {
      if (!detailStr) return "";
      let cleaned = String(detailStr).trim();
      cleaned = cleaned.replace(/학생부/g, "").replace(/전형/g, "").trim();
      return cleaned;
    }

    // Helper: Date Formatter & Equal Date Shortener
    function formatDate(dateStr) {
      if (!dateStr) return "";
      let str = String(dateStr).trim();

      // Handling Range Date format (e.g. '2026-12-11 ~ 2026-12-11')
      if (str.includes('~')) {
        const parts = str.split('~').map(p => p.trim());
        if (parts.length === 2 && parts[0] === parts[1]) {
          str = parts[0];
        }
      }

      let cleaned = str.replace(/[.\/]/g, '-');
      const dateObj = new Date(cleaned);

      if (isNaN(dateObj.getTime())) {
        return str; // Return original string if not parsed as date
      }

      const yy = String(dateObj.getFullYear()).slice(-2);
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dayName = days[dateObj.getDay()];

      return `'${yy}.${mm}.${dd}.(${dayName})`;
    }

    // Table Render Logic
    function renderTable() {
      const selectedClass = document.getElementById('classSelect').value;
      const normalizedTargetClass = normalizeClassName(selectedClass);

      const classData = rawDatabase.filter(item => normalizeClassName(item.gradeClass) === normalizedTargetClass);

      // Grouping by student number & name
      const studentGroupMap = new Map();
      classData.forEach(item => {
        const key = `${item.num}_${item.name}`;
        if (!studentGroupMap.has(key)) {
          studentGroupMap.set(key, {
            num: item.num,
            name: item.name,
            gradeClass: item.gradeClass,
            applications: []
          });
        }
        studentGroupMap.get(key).applications.push(item);
      });

      const groupedStudents = Array.from(studentGroupMap.values());
      groupedStudents.sort((a, b) => Number(a.num) - Number(b.num));

      document.getElementById('studentCountBadge').innerText = `총 학생수: ${groupedStudents.length}명`;

      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';

      const isEditor = (currentRole === 'teacher' || currentRole === 'admin');

      if (groupedStudents.length === 0) {
        const colSpanCount = isEditor ? 13 : 12;
        tbody.innerHTML = `
          <tr>
            <td colspan="${colSpanCount}" class="py-12 text-center text-slate-400 bg-slate-50">
              <i class="fa-solid fa-folder-open text-3xl mb-2 block text-slate-300"></i>
              선택한 학급(${selectedClass})의 등록된 데이터가 없습니다. ${isEditor ? '엑셀을 업로드하거나 지원 내역을 추가해 주세요.' : ''}
            </td>
          </tr>`;
        return;
      }

      groupedStudents.forEach(student => {
        const appCount = student.applications.length;

        student.applications.forEach((app, index) => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50/80 transition border-b border-slate-200";

          let studentInfoCells = '';
          if (index === 0) {
            const classShort = student.gradeClass.replace("3학년 ", "");
            studentInfoCells = `
              <td rowspan="${appCount}" class="py-2 px-2 text-center font-semibold text-slate-700 bg-white border-r border-slate-200 align-middle">${classShort}</td>
              <td rowspan="${appCount}" class="py-2 px-2 text-center font-medium text-slate-600 bg-white border-r border-slate-200 align-middle">${student.num}</td>
              <td rowspan="${appCount}" class="py-2 px-3 text-center font-bold text-slate-900 bg-white border-r border-slate-200 align-middle">${student.name}</td>
            `;
          }

          const isStep1Failed = (app.step1 === '1차불합');

          const univText = renderCellContent(summarizeUniv(app.university), "font-semibold text-slate-800");
          const detailTypeText = renderCellContent(summarizeDetailType(app.detailType));
          const deptText = renderCellContent(app.dept);
          const minExamText = renderCellContent(app.minExam);
          const interviewDateText = renderCellContent(formatDate(app.interviewDate));

          // Disabled UI logic when 1단계 is '1차불합'
          let finalDateText, finalStepSelect, failReasonText;

          if (isStep1Failed) {
            finalDateText = `<span class="text-slate-400">-</span>`;
            finalStepSelect = `<span class="text-slate-400 font-medium">-</span>`;
            failReasonText = renderCellContent(app.failReason || "1단계 불합격");
          } else {
            finalDateText = renderCellContent(formatDate(app.finalDate));
            finalStepSelect = createStatusSelectHtml(app.id, 'finalStep', app.finalStep, isEditor, ['합격', '불합격', '추합']);
            failReasonText = renderCellContent(app.failReason);
          }

          const step1Select = createStatusSelectHtml(app.id, 'step1', app.step1, isEditor, ['1차합격', '1차불합']);

          const actionCellHtml = isEditor ? `
            <td class="py-2 px-2 text-center align-middle bg-white">
              <div class="flex justify-center space-x-1">
                <button onclick="openRecordModal(${app.id})" class="text-indigo-600 hover:text-indigo-800 p-1" title="수정"><i class="fa-solid fa-pen-to-square"></i></button>
                <button onclick="deleteRecord(${app.id})" class="text-rose-600 hover:text-rose-800 p-1" title="삭제"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          ` : '';

          tr.innerHTML = `
            ${studentInfoCells}
            <td class="py-2 px-3 text-center border-r border-slate-200 ${getCellBgClass(app.university)}">${univText}</td>
            <td class="py-2 px-3 text-center border-r border-slate-200 ${getCellBgClass(app.detailType)}">${detailTypeText}</td>
            <td class="py-2 px-3 text-center border-r border-slate-200 ${getCellBgClass(app.dept)}">${deptText}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 ${getCellBgClass(app.minExam)}">${minExamText}</td>
            <td class="py-2 px-3 text-center border-r border-slate-200 ${getCellBgClass(app.interviewDate)}">${interviewDateText}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 bg-indigo-50/20">${step1Select}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 ${isStep1Failed ? 'disabled-stage-cell' : getCellBgClass(app.finalDate)}">${finalDateText}</td>
            <td class="py-2 px-2 text-center border-r border-slate-200 ${isStep1Failed ? 'disabled-stage-cell' : 'bg-indigo-50/20'}">${finalStepSelect}</td>
            <td class="py-2 px-3 text-center border-r border-slate-200 ${isStep1Failed ? 'disabled-stage-cell' : getCellBgClass(app.failReason)}">${failReasonText}</td>
            ${actionCellHtml}
          `;

          tbody.appendChild(tr);
        });
      });
    }

    function getCellBgClass(value) {
      if (!value || String(value).trim() === "" || String(value).trim() === "-") {
        return "empty-cell";
      }
      return "bg-white";
    }

    function renderCellContent(value, extraClass = "") {
      if (!value || String(value).trim() === "" || String(value).trim() === "-") {
        return `<span class="text-slate-400 font-normal">-</span>`;
      }
      return `<span class="${extraClass}">${value}</span>`;
    }

    // Dynamic Select Box Generator
    function createStatusSelectHtml(id, field, currentValue, isEditor, options) {
      const val = (currentValue || "").trim();

      if (!isEditor) {
        if (!val) return `<span class="text-slate-400">-</span>`;
        let colorBadge = "bg-slate-100 text-slate-700";
        if (val === "합격" || val === "1차합격") colorBadge = "bg-emerald-100 text-emerald-800 font-bold";
        if (val === "불합격" || val === "1차불합") colorBadge = "bg-rose-100 text-rose-800 font-medium";
        if (val === "추합") colorBadge = "bg-amber-100 text-amber-800 font-bold";
        return `<span class="px-2 py-0.5 rounded text-[11px] ${colorBadge}">${val}</span>`;
      }

      let colorStyle = "bg-slate-100 text-slate-500 border-slate-200";
      if (val === "합격" || val === "1차합격") colorStyle = "bg-emerald-100 text-emerald-800 border-emerald-300 font-bold";
      if (val === "불합격" || val === "1차불합") colorStyle = "bg-rose-100 text-rose-800 border-rose-300 font-medium";
      if (val === "추합") colorStyle = "bg-amber-100 text-amber-800 border-amber-300 font-bold";

      const optionsHtml = options.map(opt => `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`).join('');

      return `
        <select onchange="updateStatus(${id}, '${field}', this.value)" 
                class="text-xs py-1 px-1 rounded border focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer ${colorStyle}">
          <option value="" ${val === "" ? "selected" : ""}>-</option>
          ${optionsHtml}
        </select>
      `;
    }

    function updateStatus(id, field, value) {
      const target = rawDatabase.find(item => item.id === id);
      if (target) {
        target[field] = value;
        renderTable();
      }
    }

    // Modal Control & Record Management
    function openRecordModal(editId = null) {
      const modal = document.getElementById('recordModal');
      modal.classList.remove('hidden');

      if (editId) {
        document.getElementById('modalTitle').innerText = '지원 내역 수정';
        const record = rawDatabase.find(r => r.id === editId);
        if (record) {
          document.getElementById('editRecordId').value = record.id;
          document.getElementById('inputGradeClass').value = record.gradeClass;
          document.getElementById('inputNum').value = record.num;
          document.getElementById('inputName').value = record.name;
          document.getElementById('inputUniversity').value = record.university || '';
          document.getElementById('inputDetailType').value = record.detailType || '';
          document.getElementById('inputDept').value = record.dept || '';
          document.getElementById('inputMinExam').value = record.minExam || '';
          document.getElementById('inputInterviewDate').value = record.interviewDate || '';
          document.getElementById('inputStep1').value = record.step1 || '';
          document.getElementById('inputFinalDate').value = record.finalDate || '';
          document.getElementById('inputFinalStep').value = record.finalStep || '';
          document.getElementById('inputFailReason').value = record.failReason || '';
        }
      } else {
        document.getElementById('modalTitle').innerText = '지원 내역 추가';
        document.getElementById('editRecordId').value = '';
        document.getElementById('inputGradeClass').value = document.getElementById('classSelect').value;
        document.getElementById('inputNum').value = '';
        document.getElementById('inputName').value = '';
        document.getElementById('inputUniversity').value = '';
        document.getElementById('inputDetailType').value = '';
        document.getElementById('inputDept').value = '';
        document.getElementById('inputMinExam').value = '';
        document.getElementById('inputInterviewDate').value = '';
        document.getElementById('inputStep1').value = '';
        document.getElementById('inputFinalDate').value = '';
        document.getElementById('inputFinalStep').value = '';
        document.getElementById('inputFailReason').value = '';
      }
    }

    function closeRecordModal() {
      document.getElementById('recordModal').classList.add('hidden');
    }

    function saveRecord(e) {
      e.preventDefault();
      const editId = document.getElementById('editRecordId').value;

      const recordData = {
        gradeClass: normalizeClassName(document.getElementById('inputGradeClass').value),
        num: Number(document.getElementById('inputNum').value),
        name: document.getElementById('inputName').value.trim(),
        university: document.getElementById('inputUniversity').value.trim(),
        detailType: document.getElementById('inputDetailType').value.trim(),
        dept: document.getElementById('inputDept').value.trim(),
        minExam: document.getElementById('inputMinExam').value.trim(),
        interviewDate: document.getElementById('inputInterviewDate').value.trim(),
        step1: document.getElementById('inputStep1').value,
        finalDate: document.getElementById('inputFinalDate').value.trim(),
        finalStep: document.getElementById('inputFinalStep').value,
        failReason: document.getElementById('inputFailReason').value.trim()
      };

      if (editId) {
        const index = rawDatabase.findIndex(r => r.id === Number(editId));
        if (index !== -1) {
          rawDatabase[index] = { ...rawDatabase[index], ...recordData };
        }
      } else {
        const newId = Date.now();
        rawDatabase.push({ id: newId, ...recordData });
      }

      closeRecordModal();
      renderTable();
    }

    function deleteRecord(id) {
      if (confirm('해당 지원 내역을 삭제하시겠습니까?')) {
        rawDatabase = rawDatabase.filter(r => r.id !== id);
        renderTable();
      }
    }

    // Excel Parsing & File Upload
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);

          if (jsonData.length === 0) {
            alert('엑셀 파일에 데이터가 없습니다.');
            return;
          }

          let newIdCounter = Date.now();
          const parsedData = jsonData.map(row => {
            newIdCounter++;
            return {
              id: newIdCounter,
              gradeClass: normalizeClassName(row['반'] || row['학급'] || row['학년반'] || "3학년 5반"),
              num: row['번호'] || row['번'] || 1,
              name: row['이름'] || row['성명'] || "미상",
              university: row['대학명'] || row['대학'] || "",
              detailType: row['세부유형'] || row['전형세부유형'] || "",
              dept: row['모집단위'] || row['학과'] || "",
              minExam: row['최저학력기준'] || row['최저'] || "",
              interviewDate: row['면접일자'] || row['면접/논술일자'] || row['논술일자'] || "",
              step1: row['1단계'] || "",
              finalDate: row['최종발표일'] || "",
              finalStep: row['최종단계'] || row['최종결과'] || "",
              failReason: row['불합격사유'] || ""
            };
          });

          rawDatabase = parsedData;
          renderTable();
          alert(`엑셀 파일에서 총 ${parsedData.length}건의 데이터를 성공적으로 불러왔습니다.`);
        } catch (err) {
          alert('엑셀 파일 처리 중 오류가 발생했습니다. 규격 포맷을 확인해 주세요.');
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // Excel Export
    function exportCurrentClassToExcel() {
      const selectedClass = document.getElementById('classSelect').value;
      const normalizedTargetClass = normalizeClassName(selectedClass);

      const exportData = rawDatabase
        .filter(item => normalizeClassName(item.gradeClass) === normalizedTargetClass)
        .map(item => ({
          '반': item.gradeClass,
          '번호': item.num,
          '이름': item.name,
          '대학명': summarizeUniv(item.university) || '',
          '세부유형': summarizeDetailType(item.detailType) || '',
          '모집단위': item.dept || '',
          '최저학력기준': item.minExam || '',
          '면접or논술일자': formatDate(item.interviewDate) || '',
          '1단계': item.step1 || '',
          '최종발표일': formatDate(item.finalDate) || '',
          '최종단계': item.finalStep || '',
          '불합격사유': item.failReason || ''
        }));

      if (exportData.length === 0) {
        alert('내보낼 데이터가 없습니다.');
        return;
      }

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, selectedClass);
      
      XLSX.writeFile(workbook, `${selectedClass}_대입진학관리.xlsx`);
    }
  </script>
</body>
